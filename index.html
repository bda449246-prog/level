<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}[hidden]{display:none!important}</style></head><body>
<title>水準器</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: full-screen canvas stage like iOS 計測 > 水準器, tab bar pinned at the bottom. Single dark look by design. */
:root{
  --bg:#000; --fg:#fff; --level:#34c759; --ref:#ff3b30;
  --bar:#121214; --bar-line:#2c2c2e; --muted:#8e8e93; --pill:rgba(44,44,46,.92);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

#demo{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:center;pointer-events:none}
#demo .note{background:var(--pill);color:var(--fg);font-size:12.5px;line-height:1.4;padding:7px 12px;border-radius:14px;text-align:center;max-width:34em}
.seg{display:inline-flex;background:var(--pill);border-radius:9px;padding:2px;pointer-events:auto}
.seg button{appearance:none;border:0;background:transparent;color:var(--fg);font:500 13px var(--font);padding:6px 12px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#636366}
.seg button:focus-visible,#start:focus-visible,.tab:focus-visible{outline:2px solid var(--level);outline-offset:2px}

#hint{position:absolute;bottom:18px;left:0;right:0;text-align:center;font-size:13px;color:var(--fg);opacity:.75;
  transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}

#gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(0,0,0,.72);cursor:pointer;padding-inline:max(16px,env(safe-area-inset-left,0px));text-align:center}
#gate p{margin:0;font-size:15px;line-height:1.6;color:#d1d1d6;max-width:22em;text-wrap:balance}
#start{display:inline-block;appearance:none;border:0;background:var(--fg);color:#000;font:600 17px var(--font);padding:13px 34px;border-radius:999px;cursor:pointer}

#tabs{flex:none;display:flex;justify-content:space-around;background:var(--bar);border-top:.5px solid var(--bar-line);
  padding-top:6px;padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{appearance:none;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
  font:500 10.5px var(--font);padding:2px 22px;cursor:pointer}
.tab svg{width:28px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}

#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pill);color:var(--fg);
  font-size:13px;padding:8px 14px;border-radius:12px;white-space:nowrap;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#hint,#toast{transition:none}}
</style>

<div id="app">
  <div id="stage" aria-label="水準器。タップで現在の角度を基準に設定">
    <canvas id="cv"></canvas>
    <div id="demo" hidden>
      <div class="note">モーションセンサーを使えない環境です。画面をドラッグすると傾きを再現できます。</div>
      <div class="seg" role="group" aria-label="デモの向き">
        <button id="dFlat" type="button" aria-pressed="true">平置き</button>
        <button id="dUp" type="button" aria-pressed="false">立てる</button>
      </div>
    </div>
    <div id="hint">タップで現在の角度を基準にします</div>
    <div id="toast" role="status"></div>
    <div id="gate" role="button" tabindex="0" aria-label="タップして水準器を開始">
      <p>画面をタップすると水準器が動き出します。<br>モーションへのアクセスを聞かれたら「許可」を選んでください。</p>
      <span id="start">タップして開始</span>
    </div>
  </div>
  <nav id="tabs">
    <button class="tab" id="tabMeasure" type="button">
      <svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="7" width="23" height="10" rx="1.5" transform="rotate(-20 14 12)"/>
        <path d="M8 14.6l-1-2.6M11.6 13.3l-1.5-4M15.2 12l-1-2.6M18.8 10.7l-1.5-4M22.4 9.4l-1-2.6" transform="rotate(0)"/>
      </svg>計測</button>
    <button class="tab" id="tabLevel" type="button" aria-current="page">
      <svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="2" y="7.5" width="24" height="9" rx="4.5"/>
        <circle cx="14" cy="12" r="2.6" fill="currentColor" stroke="none"/>
        <path d="M9.5 8v8M18.5 8v8"/>
      </svg>水準器</button>
  </nav>
</div>

<script>
(() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const gate = document.getElementById('gate'), demoBar = document.getElementById('demo');
  const hint = document.getElementById('hint'), toastEl = document.getElementById('toast');
  const css = getComputedStyle(document.documentElement);
  const C = { bg: css.getPropertyValue('--bg').trim() || '#000', fg: '#fff', ink: '#000',
              level: css.getPropertyValue('--level').trim() || '#34c759', ref: css.getPropertyValue('--ref').trim() || '#ff3b30' };
  const FONT = css.getPropertyValue('--font').trim();

  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 3); W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  }
  new ResizeObserver(resize).observe(stage); resize();

  // ---------- sensor state ----------
  let raw = null;              // latest "down" unit vector, device coords (x right, y top, z out of screen)
  let g = [0.04, -0.03, -1];   // smoothed
  let source = 'demo';         // 'motion' | 'orient' | 'demo'
  let lastOrient = null, vote = -4; // vote>=0 → down = +accel, else down = −accel (W3C convention)
  let alive = false;

  const norm = v => { const n = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / n, v[1] / n, v[2] / n]; };
  const orientDown = (b, gm) => { const B = b * D2R, G = gm * D2R;
    return [Math.sin(G) * Math.cos(B), -Math.sin(B), -Math.cos(B) * Math.cos(G)]; };

  function onOrient(e) {
    if (e.beta == null || e.gamma == null) return;
    lastOrient = orientDown(e.beta, e.gamma); alive = true;
    if (source !== 'motion') { raw = lastOrient; source = 'orient'; }
  }
  function onMotion(e) {
    const a = e.accelerationIncludingGravity;
    if (!a || a.x == null || a.y == null || a.z == null) return;
    const n = Math.hypot(a.x, a.y, a.z); if (n < 2) return;
    const v = [a.x / n, a.y / n, a.z / n];
    // Platforms disagree on the sign; settle it against deviceorientation (whose y/z signs are reliable).
    if (lastOrient) {
      const d = v[1] * lastOrient[1] + v[2] * lastOrient[2];
      if (Math.abs(d) > 0.3) vote = Math.max(-40, Math.min(40, vote + (d > 0 ? 1 : -1)));
    }
    const s = vote >= 0 ? 1 : -1;
    raw = [v[0] * s, v[1] * s, v[2] * s]; source = 'motion'; alive = true;
  }

  async function start() {
    if (start.busy) return; start.busy = true;
    gate.hidden = true;
    // iOS: both permission requests must be issued inside the same tap, before any await.
    const asks = [];
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function')
      asks.push(DeviceMotionEvent.requestPermission().catch(() => 'denied'));
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')
      asks.push(DeviceOrientationEvent.requestPermission().catch(() => 'denied'));
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {}
    const res = await Promise.all(asks);
    const ok = res.some(r => r === 'granted') || asks.length === 0;
    setTimeout(() => { if (!alive) enterDemo(ok
      ? 'センサーの値が届きませんでした。HTTPSのページをSafariで開いてください。画面をドラッグすると傾きを再現できます。'
      : 'この画面ではモーションセンサーの利用が許可されませんでした。画面をドラッグすると傾きを再現できます。'); }, ok ? 1500 : 0);
    setTimeout(() => hint.classList.add('gone'), 4500);
  }
  gate.addEventListener("click", start);
  gate.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); } });

  // ---------- demo (drag to tilt) ----------
  let demoBase = 'flat', simX = 3.4, simY = -1.2; // degrees
  const K = 0.05; // degrees per px — fine enough to step through 0.1°
  function simVector() {
    if (demoBase === 'flat') return norm([Math.sin(simX * D2R), Math.sin(simY * D2R), -1]);
    const r = simX * D2R; return norm([Math.sin(r), -Math.cos(r), -Math.sin(simY * D2R) * 0.6]);
  }
  function enterDemo(msg) { if (msg) demoBar.querySelector('.note').textContent = msg; source = 'demo'; demoBar.hidden = false; }
  const dFlat = document.getElementById('dFlat'), dUp = document.getElementById('dUp');
  function setBase(b) { demoBase = b; simX = b === 'flat' ? 3.4 : -7.3; simY = b === 'flat' ? -1.2 : 0;
    dFlat.setAttribute('aria-pressed', b === 'flat'); dUp.setAttribute('aria-pressed', b === 'up'); clearRef(); }
  dFlat.addEventListener('click', e => { e.stopPropagation(); setBase('flat'); });
  dUp.addEventListener('click', e => { e.stopPropagation(); setBase('up'); });
  [dFlat, dUp].forEach(b => b.addEventListener('pointerdown', e => e.stopPropagation()));

  let ptr = null;
  stage.addEventListener('pointerdown', e => {
    if (!gate.hidden) return;
    ptr = { x: e.clientX, y: e.clientY, sx: simX, sy: simY, moved: false };
    stage.setPointerCapture(e.pointerId);
  });
  stage.addEventListener('pointermove', e => {
    if (!ptr) return;
    const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
    if (!ptr.moved && Math.hypot(dx, dy) > 6) ptr.moved = true;
    if (ptr.moved && source === 'demo') { simX = ptr.sx + dx * K; simY = ptr.sy - dy * K; }
  });
  stage.addEventListener('pointerup', () => {
    if (ptr && !ptr.moved) toggleRef();
    ptr = null;
  });
  stage.addEventListener('pointercancel', () => { ptr = null; });

  // ---------- level logic ----------
  let mode = 'flat', refVec = null, refRoll = null, isLevel = false, shown = 0, shownAt = 0;
  let cur = { x: 0, y: 0, z: -1, roll: 0 };

  function screenAngle() {
    const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle
            : (typeof window.orientation === 'number' ? window.orientation : 0);
    return a * D2R;
  }
  function toScreen(v) { // device → screen-upright coords (x right, y up)
    const a = screenAngle(), c = Math.cos(a), s = Math.sin(a);
    return [v[0] * c - v[1] * s, v[0] * s + v[1] * c, v[2]];
  }
  const wrap180 = d => ((d + 180) % 360 + 360) % 360 - 180;
  const wrap45 = d => ((d + 45) % 90 + 90) % 90 - 45;

  function clearRef() { refVec = null; refRoll = null; }
  function toggleRef() {
    if (refVec || refRoll != null) { clearRef(); return; }
    if (mode === 'flat') refVec = [cur.x, cur.y, cur.z]; else refRoll = cur.roll;
  }

  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2200); }
  document.getElementById('tabMeasure').addEventListener('click', () => toast('このページは水準器だけを再現しています'));

  // ---------- drawing ----------
  function fmt(v) { let s = (Math.round(v * 10) / 10).toFixed(1); if (s === '-0.0') s = '0.0'; return s + '°'; }

  function drawNumber(text, x, y, size, color) {
    ctx.fillStyle = color; ctx.font = `200 ${size}px ${FONT}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
  }
  // degree sign hangs off the right, like iOS: center the digits, not the whole string
  function numX(text, cx, size) {
    ctx.font = `200 ${size}px ${FONT}`;
    return cx + ctx.measureText('°').width / 2;
  }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(0.1, (t - last) / 1000); last = t;
    const target = source === 'demo' ? simVector() : raw;
    if (target) {
      const a = 1 - Math.exp(-dt / (source === 'demo' ? 0.05 : 0.16));
      g = norm([g[0] + (target[0] - g[0]) * a, g[1] + (target[1] - g[1]) * a, g[2] + (target[2] - g[2]) * a]);
    }
    const [x, y, z] = toScreen(g);
    const tilt = Math.acos(Math.min(1, Math.abs(z))) * R2D;
    if (mode === 'flat' && tilt > 50) { mode = 'up'; clearRef(); }
    else if (mode === 'up' && tilt < 40) { mode = 'flat'; clearRef(); }

    const roll = Math.atan2(-y, x) * R2D - 90; // 0 when held upright in portrait
    cur = { x, y, z, roll };

    let value, dir = [0, 0];
    if (mode === 'flat') {
      if (refVec) {
        const d = Math.max(-1, Math.min(1, x * refVec[0] + y * refVec[1] + z * refVec[2]));
        value = Math.acos(d) * R2D; dir = [x - refVec[0], y - refVec[1]];
      } else { value = tilt; dir = [x, y]; }
    } else {
      value = refRoll != null ? wrap180(roll - refRoll) : wrap45(roll);
      value = -value; // clockwise rotation of the phone reads positive
    }

    // display hysteresis so the 0.1° digit doesn't chatter
    if (Math.abs(value - shown) >= 0.06 || t - shownAt > 400) { shown = value; shownAt = t; }
    const absv = Math.abs(shown);
    if (!isLevel && absv < 0.05) isLevel = true; else if (isLevel && absv >= 0.15) isLevel = false;
    const hasRef = !!refVec || refRoll != null;
    const bg = isLevel ? C.level : (hasRef ? C.ref : C.bg);
    const text = fmt(mode === 'flat' ? absv : shown);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const cx = W / 2, cy = H / 2, m = Math.min(W, H);
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    if (mode === 'flat') {
      const R = m * 0.3;
      const dl = Math.hypot(dir[0], dir[1]);
      const off = Math.min(value * R * 0.055, R * 1.25);
      const ux = dl > 1e-6 ? dir[0] / dl : 0, uy = dl > 1e-6 ? -dir[1] / dl : 0;
      const c1 = [cx + ux * off, cy + uy * off], c2 = [cx - ux * off, cy - uy * off];
      const circ = c => { ctx.beginPath(); ctx.arc(c[0], c[1], R, 0, Math.PI * 2); };
      ctx.fillStyle = C.fg; circ(c1); ctx.fill(); circ(c2); ctx.fill();
      ctx.save(); circ(c1); ctx.clip(); ctx.fillStyle = bg; circ(c2); ctx.fill(); ctx.restore();

      const size = m * 0.17, tx = numX(text, cx, size);
      drawNumber(text, tx, cy, size, C.fg);
      ctx.save(); circ(c1); ctx.clip(); drawNumber(text, tx, cy, size, C.ink); ctx.restore();
      ctx.save(); circ(c2); ctx.clip(); drawNumber(text, tx, cy, size, C.ink); ctx.restore();
      ctx.save(); circ(c1); ctx.clip(); circ(c2); ctx.clip(); drawNumber(text, tx, cy, size, C.fg); ctx.restore();
    } else {
      // horizon: ground half-plane stays level with the real world
      const phi = Math.atan2(-y, x);                     // screen-space angle of "down" (y flipped)
      const shift = Math.max(-0.45, Math.min(0.45, -z * 0.5)) * H;
      const ground = () => {
        ctx.translate(cx, cy); ctx.rotate(phi - Math.PI / 2);
        ctx.beginPath(); ctx.rect(-3 * m - W, shift, 6 * m + 2 * W, 3 * m + 2 * H);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      };
      ctx.save(); ground(); ctx.fillStyle = isLevel ? C.level : C.fg; ctx.fill(); ctx.restore();

      const size = m * 0.2, tx = numX(text, cx, size);
      drawNumber(text, tx, cy, size, C.fg);
      if (!isLevel) { ctx.save(); ground(); ctx.clip(); drawNumber(text, tx, cy, size, C.ink); ctx.restore(); }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

})();
</script>

</body></html>
