<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}[hidden]{display:none!important}</style></head><body>
<title>水準器ピアノ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the iOS 計測 > 水準器 screen, plus a scrolling piano strip at the bottom of the stage and a compact settings row on top. Single dark look by design. */
:root{
  --bg:#000; --fg:#fff; --level:#34c759; --ref:#ff3b30; --key:#ffd60a; --key-soft:#8a7a3a;
  --bar:#121214; --bar-line:#2c2c2e; --muted:#8e8e93; --pill:rgba(44,44,46,.92); --seg-on:#636366;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans","Hiragino Kaku Gothic ProN","Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:pointer}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

#top{position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
#controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.seg{display:inline-flex;background:var(--pill);border-radius:9px;padding:2px;pointer-events:auto}
.seg button,#mute{appearance:none;border:0;background:transparent;color:var(--fg);font:500 13px var(--font);padding:6px 10px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--seg-on)}
.pick{position:relative;display:inline-flex;align-items:center;gap:6px;background:var(--pill);border-radius:9px;padding-left:10px;pointer-events:auto;cursor:pointer}
.pick-label{font:500 11px var(--font);color:var(--muted);letter-spacing:.04em}
.pick select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--fg);font:600 13px var(--font);padding:6px 26px 6px 0;cursor:pointer}
.pick::after{content:"";position:absolute;right:10px;top:50%;width:6px;height:6px;border-right:1.6px solid var(--fg);border-bottom:1.6px solid var(--fg);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.pick:focus-within{outline:2px solid var(--level);outline-offset:2px}
#mute{background:var(--pill);border-radius:9px;padding:6px 9px;display:inline-flex;align-items:center;pointer-events:auto}
#mute svg{width:18px;height:18px}
#mute[aria-pressed="true"]{color:var(--ref)}
.seg button:focus-visible,#mute:focus-visible,#gate:focus-visible,.tab:focus-visible{outline:2px solid var(--level);outline-offset:2px}
#demo{background:var(--pill);color:var(--fg);font-size:12.5px;line-height:1.4;padding:7px 12px;border-radius:14px;text-align:center;max-width:34em}

#hint{position:absolute;left:0;right:0;bottom:120px;text-align:center;font-size:13px;color:var(--fg);opacity:.8;
  padding-inline:16px;transition:opacity .6s;pointer-events:none}
#hint.gone{opacity:0}

#gate{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:rgba(0,0,0,.74);cursor:pointer;padding-inline:max(16px,env(safe-area-inset-left,0px));text-align:center}
#gate p{margin:0;font-size:15px;line-height:1.6;color:#d1d1d6;max-width:22em;text-wrap:balance}
#start{display:inline-block;background:var(--fg);color:#000;font:600 17px var(--font);padding:13px 34px;border-radius:999px}

#tabs{flex:none;display:flex;justify-content:space-around;background:var(--bar);border-top:.5px solid var(--bar-line);
  padding-top:6px;padding-bottom:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tab{appearance:none;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;
  font:500 10.5px var(--font);padding:2px 22px;cursor:pointer;text-decoration:none}
.tab svg{width:28px;height:24px}
.tab[aria-current="page"]{color:var(--fg)}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<div id="app">
  <div id="stage" aria-label="水準器ピアノ。傾けると角度に合わせた音が鳴ります。タップで現在の角度を基準にします">
    <canvas id="cv"></canvas>
    <div id="top">
      <div id="controls">
        <label class="pick" for="inst">
          <span class="pick-label">楽器</span>
          <select id="inst" aria-label="楽器">
            <option value="piano">ピアノ</option>
            <option value="guitar">ギター</option>
            <option value="violin">バイオリン</option>
            <option value="trumpet">トランペット</option>
            <option value="sax">サックス</option>
          </select>
        </label>
        <div class="seg" role="group" aria-label="音階">
          <button id="scWhite" type="button" aria-pressed="true">ドレミ</button>
          <button id="scChrom" type="button" aria-pressed="false">半音</button>
        </div>
        <div class="seg" role="group" aria-label="1音あたりの角度">
          <button type="button" data-step="0.5" aria-pressed="false">0.5°</button>
          <button type="button" data-step="1" aria-pressed="false">1°</button>
          <button type="button" data-step="2" aria-pressed="true">2°</button>
          <button type="button" data-step="5" aria-pressed="false">5°</button>
        </div>
        <button id="mute" type="button" aria-pressed="false" aria-label="消音">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
            <path id="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
            <path id="xmark" d="M16 9.5l5 5M21 9.5l-5 5" style="display:none"/>
          </svg>
        </button>
        <div class="seg" role="group" aria-label="演奏のしかた">
          <button type="button" data-play="single" aria-pressed="true">単音</button>
          <button type="button" data-play="chord" aria-pressed="false">和音</button>
          <button type="button" data-play="arp" aria-pressed="false">アルペジオ</button>
        </div>
        <div class="seg" id="tempo" role="group" aria-label="テンポ" hidden>
          <button type="button" data-bpm="70" aria-pressed="false">♩70</button>
          <button type="button" data-bpm="100" aria-pressed="true">♩100</button>
          <button type="button" data-bpm="130" aria-pressed="false">♩130</button>
        </div>
      </div>
      <div id="demo" hidden>モーションセンサーを使えない環境です。画面をドラッグすると傾きを再現できます。</div>
    </div>
    <div id="hint">傾けると角度に合わせて音が鳴ります。タップで今の角度を「ド」(和音ならC)にします</div>
    <div id="gate" role="button" tabindex="0" aria-label="タップして開始">
      <p>画面をタップすると水準器ピアノが動き出します。<br>モーションへのアクセスを聞かれたら「許可」を選んでください。<br>音が出ないときは消音モードを解除してください。</p>
      <span id="start">タップして開始</span>
    </div>
  </div>
  <nav id="tabs">
    <a class="tab" id="tabLevel" href="../">
      <svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <rect x="2" y="7.5" width="24" height="9" rx="4.5"/>
        <circle cx="14" cy="12" r="2.6" fill="currentColor" stroke="none"/>
        <path d="M9.5 8v8M18.5 8v8"/>
      </svg>水準器</a>
    <button class="tab" id="tabPiano" type="button" aria-current="page">
      <svg viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true">
        <rect x="2.5" y="4" width="23" height="16" rx="2"/>
        <path d="M8.2 4v16M14 4v16M19.8 4v16"/>
        <path d="M6.6 4h3.2v9H6.6zM12.4 4h3.2v9h-3.2zM18.2 4h3.2v9h-3.2z" fill="currentColor"/>
      </svg>ピアノ</button>
  </nav>
</div>

<script>
(() => {
  const D2R = Math.PI / 180, R2D = 180 / Math.PI;
  const stage = document.getElementById('stage');
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const gate = document.getElementById('gate'), demoEl = document.getElementById('demo');
  const hint = document.getElementById('hint');
  const css = getComputedStyle(document.documentElement);
  const tok = (n, d) => css.getPropertyValue(n).trim() || d;
  const C = { bg: tok('--bg', '#000'), fg: '#fff', ink: '#000', level: tok('--level', '#34c759'),
              ref: tok('--ref', '#ff3b30'), key: tok('--key', '#ffd60a'), keySoft: tok('--key-soft', '#8a7a3a') };
  const FONT = tok('--font', 'sans-serif');

  // In the Claude viewer the tab link to the plain level has nowhere to go.
  if (location.protocol !== 'https:' || !/github\.io$/.test(location.hostname)) {
    const t = document.getElementById('tabLevel'); t.removeAttribute('href'); t.style.cursor = 'default';
  }

  let W = 0, H = 0, DPR = 1;
  function resize() {
    const r = stage.getBoundingClientRect();
    DPR = Math.min(window.devicePixelRatio || 1, 3); W = r.width; H = r.height;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  }
  new ResizeObserver(resize).observe(stage); resize();

  // ---------- settings ----------
  const store = { get(k, d) { try { const v = localStorage.getItem('lvp.' + k); return v == null ? d : v; } catch (_) { return d; } },
                  set(k, v) { try { localStorage.setItem('lvp.' + k, v); } catch (_) {} } };
  let scale = store.get('scale', 'white');
  let STEP = parseFloat(store.get('step', '2')) || 2;
  let muted = store.get('muted', '0') === '1';
  let tone = store.get('tone', 'guitar');
  let play = store.get('play', 'single');
  let bpm = parseFloat(store.get('bpm', '100')) || 100;
  const playBtns = [...document.querySelectorAll('[data-play]')], bpmBtns = [...document.querySelectorAll('[data-bpm]')];
  const tempoEl = document.getElementById('tempo');
  const instSel = document.getElementById('inst');
  if (![...instSel.options].some(o => o.value === tone)) tone = 'guitar';
  const scWhite = document.getElementById('scWhite'), scChrom = document.getElementById('scChrom');
  const stepBtns = [...document.querySelectorAll('[data-step]')];
  const muteBtn = document.getElementById('mute');
  function syncUI() {
    playBtns.forEach(b => b.setAttribute('aria-pressed', b.dataset.play === play));
    bpmBtns.forEach(b => b.setAttribute('aria-pressed', parseFloat(b.dataset.bpm) === bpm));
    tempoEl.hidden = play !== 'arp';
    instSel.value = tone;
    scWhite.setAttribute('aria-pressed', scale === 'white'); scChrom.setAttribute('aria-pressed', scale === 'chrom');
    stepBtns.forEach(b => b.setAttribute('aria-pressed', parseFloat(b.dataset.step) === STEP));
    muteBtn.setAttribute('aria-pressed', muted); muteBtn.setAttribute('aria-label', muted ? '消音を解除' : '消音');
    document.getElementById('waves').style.display = muted ? 'none' : '';
    document.getElementById('xmark').style.display = muted ? '' : 'none';
  }
  syncUI();
  const setTone = v => { releaseHeld(0.12); damp(0.1); tone = v; store.set('tone', v); syncUI(); initAudio(); onNote(); };
  playBtns.forEach(b => b.addEventListener('click', () => { play = b.dataset.play; store.set('play', play); syncUI(); initAudio(); releaseHeld(0.12); damp(0.08); onNote(); }));
  bpmBtns.forEach(b => b.addEventListener('click', () => { bpm = parseFloat(b.dataset.bpm); store.set('bpm', bpm); syncUI(); }));
  instSel.addEventListener('change', () => setTone(instSel.value));
  scWhite.addEventListener('click', () => { scale = 'white'; store.set('scale', scale); syncUI(); });
  scChrom.addEventListener('click', () => { scale = 'chrom'; store.set('scale', scale); syncUI(); });
  stepBtns.forEach(b => b.addEventListener('click', () => { STEP = parseFloat(b.dataset.step); store.set('step', STEP); syncUI(); }));
  muteBtn.addEventListener('click', () => { muted = !muted; store.set('muted', muted ? '1' : '0'); syncUI();
    initAudio(); if (muted) { damp(0.03); releaseHeld(0.05); } else onNote(); });
  document.querySelectorAll('#controls button, #controls .pick').forEach(b => {
    b.addEventListener('pointerdown', e => e.stopPropagation());
    b.addEventListener('pointerup', e => e.stopPropagation());
  });

  // ---------- piano voice (Web Audio additive synth) ----------
  let ac = null, master = null, noiseBuf = null;
  const voices = [];
  function initAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!ac) {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (_) {}
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.2;
      master = ac.createGain(); master.gain.value = 0.55;
      master.connect(comp); comp.connect(ac.destination);
      // small hall: generated impulse response, sent from every instrument
      const ir = ac.createBuffer(2, Math.floor(ac.sampleRate * 2.2), ac.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch);
        for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2.6) * (i < 200 ? i / 200 : 1); }
      const verb = ac.createConvolver(); verb.buffer = ir;
      const wet = ac.createGain(); wet.gain.value = 0.16;
      master.connect(verb); verb.connect(wet); wet.connect(comp);
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.06), ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
      const s = ac.createBufferSource(); s.buffer = ac.createBuffer(1, 1, 22050); s.connect(ac.destination); s.start(0);
      // guitar body: low air/top resonances, a scooped mid, softened top end
      const pk = (fr, gain, q) => { const b = ac.createBiquadFilter(); b.type = 'peaking'; b.frequency.value = fr; b.gain.value = gain; b.Q.value = q; return b; };
      const b1 = pk(105, 6, 1.4), b2 = pk(210, 4, 1.6), b3 = pk(480, -3, 1.0), b4 = pk(2600, 2.5, 0.9);
      const hs = ac.createBiquadFilter(); hs.type = 'highshelf'; hs.frequency.value = 6000; hs.gain.value = -7;
      guitarBus = ac.createGain(); guitarBus.gain.value = 0.9;
      guitarBus.connect(b1); b1.connect(b2); b2.connect(b3); b3.connect(b4); b4.connect(hs); hs.connect(master);
      buildSustained(pk);
    }
    if (ac.state !== 'running') ac.resume().catch(() => {});
  }
  function hold(param, t) {
    if (param.cancelAndHoldAtTime) param.cancelAndHoldAtTime(t);
    else { const v = param.value; param.cancelScheduledValues(t); param.setValueAtTime(v, t); }
  }
  function damp(tc) {
    if (!ac) return;
    const t = ac.currentTime;
    for (const v of voices) if (!v.damped) { v.damped = true; hold(v.out.gain, t); v.out.gain.setTargetAtTime(0, t, tc); }
  }

  // ---------- sustained instruments: violin, trumpet, saxophone ----------
  // A shaped harmonic wavetable per instrument, a brightness filter that opens on each attack,
  // delayed vibrato, breath/bow noise, and a fixed body/bell EQ on the instrument's bus.
  const SUS = {
    violin: { amps: n => 1 / n * (n % 2 ? 1 : 0.86), N: 40, attack: 0.13, release: 0.32, sus: 0.85, level: 0.30,
      vib: { rate: 5.8, depth: 17, delay: 0.22 }, glide: 0.035, reart: 0.72,
      bright: { start: 1.6, f: 7, add: 1200, tc: 0.09 }, scoop: 1, noise: 0.045, noiseQ: 0.6, noiseAt: 3200,
      eq: [['highpass', 190, 0, 0.7], ['peaking', 290, 4, 1.3], ['peaking', 520, -2, 1.2], ['peaking', 2900, 6, 1.4], ['peaking', 5200, -5, 1.0], ['lowpass', 9500, 0, 0.6]] },
    trumpet: { amps: n => Math.pow(n, -0.55), N: 32, attack: 0.03, release: 0.11, sus: 0.8, level: 0.24,
      vib: { rate: 5.2, depth: 6, delay: 0.45 }, glide: 0.014, reart: 0.3,
      bright: { start: 1.1, f: 4.2, add: 700, tc: 0.045 }, scoop: 0.965, noise: 0.012, noiseQ: 1.2, noiseAt: 1400,
      eq: [['highpass', 160, 0, 0.7], ['peaking', 1250, 6, 1.1], ['peaking', 2600, 3, 1.4], ['peaking', 400, -3, 1.0], ['lowpass', 8000, 0, 0.7]] },
    sax: { amps: n => Math.pow(n, -0.8) * (n <= 6 && n % 2 ? 1.25 : 1), N: 32, attack: 0.05, release: 0.17, sus: 0.82, level: 0.26,
      vib: { rate: 5.3, depth: 13, delay: 0.32 }, glide: 0.028, reart: 0.5,
      bright: { start: 1.4, f: 4.6, add: 1500, tc: 0.07 }, scoop: 0.985, noise: 0.07, noiseQ: 0.7, noiseAt: 2300,
      eq: [['highpass', 120, 0, 0.7], ['peaking', 580, 4, 1.1], ['peaking', 1650, 5, 1.0], ['peaking', 3100, -2, 1.2], ['lowpass', 7200, 0, 0.7]] },
  };
  const isSus = () => !!SUS[tone];
  let loopNoise = null;
  function buildSustained() {
    const len = ac.sampleRate * 2; loopNoise = ac.createBuffer(1, len, ac.sampleRate);
    const d = loopNoise.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    for (const k in SUS) {
      const def = SUS[k];
      const real = new Float32Array(def.N + 1), imag = new Float32Array(def.N + 1);
      for (let n = 1; n <= def.N; n++) imag[n] = def.amps(n);
      def.wave = ac.createPeriodicWave(real, imag);
      def.bus = ac.createGain(); def.bus.gain.value = 1;
      let node = def.bus;
      for (const [type, fr, gain, q] of def.eq) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = fr; b.gain.value = gain; b.Q.value = q; node.connect(b); node = b; }
      node.connect(master);
    }
  }
  const mf = m => 440 * Math.pow(2, (m - 69) / 12);
  function susVoice(midi, vel, t, detune = 0) {
    const def = SUS[tone], f = mf(midi), L = vel * def.level;
    const osc = ac.createOscillator(); osc.setPeriodicWave(def.wave); osc.detune.value = detune;
    osc.frequency.setValueAtTime(f * def.scoop, t); osc.frequency.setTargetAtTime(f, t, 0.025);
    const lfo = ac.createOscillator(); lfo.frequency.value = def.vib.rate * (0.94 + Math.random() * 0.12);
    const lfoG = ac.createGain(); lfoG.gain.setValueAtTime(0, t); lfoG.gain.setTargetAtTime(def.vib.depth, t + def.vib.delay, 0.25);
    lfo.connect(lfoG); lfoG.connect(osc.detune);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.8;
    const open = (tt, ff) => { hold(lp.frequency, tt); lp.frequency.setValueAtTime(Math.min(16000, ff * def.bright.start), tt);
      lp.frequency.setTargetAtTime(Math.min(16000, ff * def.bright.f + def.bright.add), tt, def.bright.tc); };
    open(t, f);
    const amp = ac.createGain();
    amp.gain.setValueAtTime(0, t); amp.gain.linearRampToValueAtTime(L, t + def.attack);
    amp.gain.setTargetAtTime(L * def.sus, t + def.attack, 0.25);
    amp.gain.setTargetAtTime(L * def.sus * 0.6, t + 2, 5); // a long held note settles back, like a player easing off
    osc.connect(lp); lp.connect(amp); amp.connect(def.bus);
    const nz = ac.createBufferSource(); nz.buffer = loopNoise; nz.loop = true; nz.loopStart = Math.random();
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = Math.max(def.noiseAt, f * 2); bp.Q.value = def.noiseQ;
    const ng = ac.createGain(); ng.gain.value = def.noise;
    nz.connect(bp); bp.connect(ng); ng.connect(amp);
    osc.start(t); lfo.start(t); nz.start(t, Math.random());
    let gone = false;
    const v = {
      out: amp, damped: false, midi,
      glide(m2, t2) {
        const f2 = mf(m2); v.midi = m2;
        hold(osc.frequency, t2); osc.frequency.setTargetAtTime(f2, t2, def.glide);
        hold(amp.gain, t2); amp.gain.setTargetAtTime(L * def.reart, t2, 0.012);
        amp.gain.setTargetAtTime(L * def.sus, t2 + 0.045, 0.07);
        amp.gain.setTargetAtTime(L * def.sus * 0.6, t2 + 2, 5);
        hold(lfoG.gain, t2); lfoG.gain.setTargetAtTime(0, t2, 0.03); lfoG.gain.setTargetAtTime(def.vib.depth, t2 + def.vib.delay, 0.25);
        open(t2, f2); bp.frequency.setTargetAtTime(Math.max(def.noiseAt, f2 * 2), t2, 0.03);
      },
      release(t2, tc = def.release) {
        if (gone) return; gone = true;
        hold(amp.gain, t2); amp.gain.setTargetAtTime(0, t2, tc / 3);
        const end = t2 + tc * 2.5 + 0.05;
        osc.stop(end); lfo.stop(end); nz.stop(end);
        setTimeout(() => { try { amp.disconnect(); } catch (_) {} const i = voices.indexOf(v); if (i >= 0) voices.splice(i, 1); },
          (end - ac.currentTime + 0.2) * 1000);
      },
    };
    return v;
  }
  // held voices: one lead line (単音) or a section holding a chord (和音)

      const off = Math.min(value * R * 0.055, R * 1.25);
      const ux = dl > 1e-6 ? dir[0] / dl : 0, uy = dl > 1e-6 ? -dir[1] / dl : 0;
      const c1 = [cx + ux * off, cy + uy * off], c2 = [cx - ux * off, cy - uy * off];
      const circ = c => { ctx.beginPath(); ctx.arc(c[0], c[1], R, 0, Math.PI * 2); };
      ctx.fillStyle = C.fg; circ(c1); ctx.fill(); circ(c2); ctx.fill();
      ctx.save(); circ(c1); ctx.clip(); ctx.fillStyle = bg; circ(c2); ctx.fill(); ctx.restore();
      const size = m * 0.17;
      labels(C.fg, cx, cy, size, text, nm);
      ctx.save(); circ(c1); ctx.clip(); labels(C.ink, cx, cy, size, text, nm); ctx.restore();
      ctx.save(); circ(c2); ctx.clip(); labels(C.ink, cx, cy, size, text, nm); ctx.restore();
      ctx.save(); circ(c1); ctx.clip(); circ(c2); ctx.clip(); labels(C.fg, cx, cy, size, text, nm); ctx.restore();
    } else {
      const phi = Math.atan2(-y, x);
      const shift = Math.max(-0.45, Math.min(0.45, -z * 0.5)) * H;
      const ground = () => {
        ctx.translate(cx, cy); ctx.rotate(phi - Math.PI / 2);
        ctx.beginPath(); ctx.rect(-3 * W - 3 * H, shift, 6 * W + 6 * H, 3 * W + 3 * H);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      };
      ctx.save(); ground(); ctx.fillStyle = isLevel ? C.level : C.fg; ctx.fill(); ctx.restore();
      const size = m * 0.2;
      labels(C.fg, cx, cy, size, text, nm);
      if (!isLevel) { ctx.save(); ground(); ctx.clip(); labels(C.ink, cx, cy, size, text, nm); ctx.restore(); }
    }
    keyboard(kbY, kbH, dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
