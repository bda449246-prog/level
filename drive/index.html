<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}[hidden]{display:none!important}</style></head><body>
<title>水準器ドライブ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: the town fills the screen; a thin HUD floats on top (minimap · wheel angle · speed/mission), pedals sit in the two bottom corners
   where thumbs rest when the phone is held like a steering wheel. Black glass pills and the level's green echo the other level apps. */
:root{
  --pill:rgba(18,18,20,.78); --fg:#fff; --dim:#a1a1a6; --ok:#34c759; --warn:#ff9f0a; --red:#ff3b30;
  --ui:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#9ccf7a;color:var(--fg);font-family:var(--ui);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#stage{position:fixed;inset:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.pill{background:var(--pill);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:16px}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px));
  display:flex;align-items:flex-start;gap:8px;pointer-events:none}
#mini{width:96px;height:96px;border-radius:14px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.3)}
#tilt{flex:1;min-width:0;max-width:300px;margin:0 auto;padding:7px 12px 9px;text-align:center}
#tilt .lbl{display:block;font-size:11px;color:var(--dim);font-weight:600}
#tiltV{font-size:28px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:.5px}
#tilt.zero #tiltV{color:var(--ok)}
#gauge{position:relative;height:6px;margin-top:5px;border-radius:3px;background:#3a3a3c;overflow:hidden}
#gauge i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--ok)}
#gauge b{position:absolute;top:-2px;bottom:-2px;left:50%;width:2px;margin-left:-1px;background:#fff}
#right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
#spd{padding:6px 12px;text-align:right;min-width:84px}
#spd b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
#spd small{font-size:11px;color:var(--dim);margin-left:3px}
#gear{font-size:11px;font-weight:700;color:var(--dim);margin-right:6px}
#gear.r{color:var(--warn)}
#mis{padding:5px 10px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;color:#e5e5ea}
#zero{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
  appearance:none;border:0;padding:8px 14px;border-radius:999px;background:var(--pill);color:#fff;font:600 13px var(--ui);cursor:pointer}
.pedal{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(26vw,128px);height:min(30vh,150px);min-height:96px;
  appearance:none;border:0;border-radius:22px;color:#fff;font:700 15px var(--ui);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:14px;gap:6px;
  background:var(--pill);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);transition:transform .06s}
.pedal svg{width:42px;height:42px;opacity:.9}
.pedal.on{transform:scale(.95)}
#gas{right:calc(14px + env(safe-area-inset-right,0px))}
#gas.on{background:rgba(52,199,89,.85)}
#brake{left:calc(14px + env(safe-area-inset-left,0px))}
#brake.on{background:rgba(255,59,48,.85)}
#notice{position:absolute;left:50%;transform:translateX(-50%);top:calc(116px + env(safe-area-inset-top,0px));max-width:calc(100% - 32px);
  padding:7px 12px;border-radius:12px;background:var(--pill);font-size:12px;font-weight:600;color:#e5e5ea;text-align:center;pointer-events:none}
#notice.warn{color:var(--warn)}
.sheet{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card{width:min(420px,100%);max-height:100%;overflow:auto;background:#1c1c1e;border-radius:24px;padding:24px 22px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h1{margin:4px 0 6px;font-size:26px;letter-spacing:1px}
.card p{margin:8px 0;font-size:14px;line-height:1.6;color:#d1d1d6;text-align:left}
.card .big{font-size:40px;font-weight:200;font-variant-numeric:tabular-nums;margin:6px 0}
.go{appearance:none;border:0;margin-top:14px;width:100%;padding:14px;border-radius:14px;background:var(--ok);color:#000;font:700 17px var(--ui);cursor:pointer}
.go:focus-visible,#zero:focus-visible,.pedal:focus-visible{outline:2px solid #fff;outline-offset:2px}
.hold{display:block;margin:6px auto 4px;width:150px;height:auto}
.stars{font-size:28px;letter-spacing:4px;color:#ffd60a}
</style>

<div id="stage">
  <canvas id="cv" aria-label="町を走る車の上からの眺め"></canvas>
  <div id="hud">
    <canvas id="mini" class="pill" width="192" height="192" aria-label="ミニマップ"></canvas>
    <div id="tilt" class="pill"><span class="lbl">ハンドル(傾き)</span><span id="tiltV">0.0°</span><div id="gauge"><i></i><b></b></div></div>
    <div id="right">
      <div id="spd" class="pill"><span id="gear">D</span><b id="kmh">0</b><small>km/h</small></div>
      <div id="mis" class="pill">配達 0/5 · 0:00</div>
    </div>
  </div>
  <div id="notice" hidden></div>
  <button id="brake" class="pedal" type="button" aria-label="ブレーキ(止まっているときは後退)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="9" width="14" height="10" rx="2"/><path d="M8 13h8M8 16h8"/></svg>ブレーキ</button>
  <button id="gas" class="pedal" type="button" aria-label="アクセル">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="8" y="3" width="8" height="18" rx="2"/><path d="M10 7h4M10 11h4M10 15h4"/></svg>アクセル</button>
  <button id="zero" type="button">0°合わせ</button>

  <div id="gate" class="sheet" role="button" tabindex="0" aria-label="タップしてスタート">
    <div class="card">
      <svg class="hold" viewBox="0 0 150 90" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round">
        <rect x="35" y="22" width="80" height="46" rx="9" transform="rotate(-14 75 45)" fill="#2c2c2e"/>
        <path d="M22 34a60 60 0 0 1 14-16" stroke="#34c759"/><path d="M128 56a60 60 0 0 1-14 16" stroke="#34c759"/>
        <path d="M18 26l4 8 8-3M132 64l-4-8-8 3" stroke="#34c759"/></g></svg>
      <h1>水準器ドライブ</h1>
      <p>スマホを両手で持って、<b>ハンドルのように左右に回す</b>と車が曲がります。傾きは水準器と同じく0.1°単位で表示されます。</p>
      <p>右下の<b>アクセル</b>で進み、左下の<b>ブレーキ</b>で止まります。止まった状態でブレーキを押し続けるとバックします。</p>
      <p>緑の目的地をめぐって、荷物を5か所に届けましょう。日本と同じ左側通行です。「0°合わせ」で今の持ち方をまっすぐ(0°)にできます。</p>
      <button class="go" type="button" tabindex="-1">タップしてスタート</button>
    </div>
  </div>
  <div id="result" class="sheet" hidden>
    <div class="card" style="text-align:center">
      <h1>配達完了!</h1>
      <div class="big" id="rTime">0:00</div>
      <div class="stars" id="rStars">★★★</div>
      <p id="rNote" style="text-align:center"></p>
      <button class="go" id="again" type="button">もう一度</button>
      <button class="go" id="free" type="button" style="background:#3a3a3c;color:#fff;margin-top:8px">このまま自由に走る</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const D2R = Math.PI / 180;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

  // ================= the town =================
  // 8×8 blocks of 40 m with 10 m two-lane roads between them (left-hand traffic). Units are metres; y points south.
  const BLK = 40, RW = 10, NB = 8, P = BLK + RW, SIZE = NB * P + RW;
  const rx = i => i * P, nc = i => i * P + RW / 2;
  // a few road segments are built over, joining two blocks into one big lot
  const MERGES = [
    { a: [1, 1], b: [2, 1], seg: 'v:2,1', type: 'park' },
    { a: [5, 2], b: [5, 3], seg: 'h:5,3', type: 'school' },
    { a: [3, 5], b: [4, 5], seg: 'v:4,5', type: 'mall' },
    { a: [1, 5], b: [1, 6], seg: 'h:1,6', type: 'city' },
    { a: [5, 6], b: [6, 6], seg: 'v:6,6', type: 'house' },
  ];
  const removed = new Set(MERGES.map(m => m.seg));
  const hasH = (i, j) => i >= 0 && i < NB && j >= 0 && j <= NB && !removed.has(`h:${i},${j}`);   // (i,j)—(i+1,j)
  const hasV = (i, j) => i >= 0 && i <= NB && j >= 0 && j < NB && !removed.has(`v:${i},${j}`);   // (i,j)—(i,j+1)
  function neighbours(i, j) {
    const out = [];
    if (hasH(i, j)) out.push([i + 1, j]); if (hasH(i - 1, j)) out.push([i - 1, j]);
    if (hasV(i, j)) out.push([i, j + 1]); if (hasV(i, j - 1)) out.push([i, j - 1]);
    return out;
  }

  const R = rng(20261115);
  const pick = a => a[Math.floor(R() * a.length)];
  const blocks = [];
  const inMerge = new Map();
  MERGES.forEach(m => { inMerge.set(m.a + '', m); inMerge.set(m.b + '', m); });
  for (let by = 0; by < NB; by++) for (let bx = 0; bx < NB; bx++) {
    const m = inMerge.get([bx, by] + '');
    if (m) {
      if (m.a[0] !== bx || m.a[1] !== by) continue;
      const x = rx(m.a[0]) + RW, y = rx(m.a[1]) + RW, x2 = rx(m.b[0]) + P, y2 = rx(m.b[1]) + P;
      blocks.push({ x, y, w: x2 - x, h: y2 - y, type: m.type });
    } else {
      const d = Math.hypot(bx - 3.5, by - 3.5);
      let type = d < 1.6 ? 'city' : R() < 0.55 ? 'house' : pick(['city', 'parking', 'park', 'house', 'city']);
      if (bx === 6 && by === 1) type = 'parking';
      blocks.push({ x: rx(bx) + RW, y: rx(by) + RW, w: BLK, h: BLK, type, tall: d < 1.6 });
    }
  }

  const buildings = [], trees = [], parked = [];
  const PAL = ['#ece6da', '#d8dfe6', '#cfd8c8', '#e6d5c9', '#dcd6e8', '#f2ebdd', '#c9d6dd', '#e9dfc7'];
  const ROOF = ['#c2554f', '#4f6e91', '#6b8d4f', '#8a6d5b', '#cf8a3d', '#5b5f66'];
  function addTree(x, y, r = 1.6 + R() * 1.2) { trees.push({ x, y, r }); }
  function splitLots(r, depth, out) {
    const long = r.w > r.h;
    if (depth <= 0 || Math.max(r.w, r.h) < 15) { out.push(r); return; }
    const t = 0.38 + R() * 0.24, gap = 3;
    if (long) { const a = (r.w - gap) * t; splitLots({ x: r.x, y: r.y, w: a, h: r.h }, depth - 1, out); splitLots({ x: r.x + a + gap, y: r.y, w: r.w - a - gap, h: r.h }, depth - 1, out); }
    else { const a = (r.h - gap) * t; splitLots({ x: r.x, y: r.y, w: r.w, h: a }, depth - 1, out); splitLots({ x: r.x, y: r.y + a + gap, w: r.w, h: r.h - a - gap }, depth - 1, out); }
  }
  for (const b of blocks) {
    const ix = b.x + 3, iy = b.y + 3, iw = b.w - 6, ih = b.h - 6; b.inner = { x: ix, y: iy, w: iw, h: ih }; b.deco = [];
    if (b.type === 'city') {
      const lots = []; splitLots(b.inner, 1 + Math.floor(R() * 2) + (b.w > 50 || b.h > 50 ? 1 : 0), lots);
      for (const l of lots) { const m = 1 + R() * 1.5;
        buildings.push({ x: l.x + m, y: l.y + m, w: l.w - 2 * m, h: l.h - 2 * m, ht: b.tall ? 16 + R() * 26 : 8 + R() * 12, c: pick(PAL), flat: true }); }
      addTree(b.x + 1.5, b.y + 1.5, 1.4); addTree(b.x + b.w - 1.5, b.y + b.h - 1.5, 1.4);
    } else if (b.type === 'house') {
      const nx = Math.max(2, Math.floor(iw / 11)), ny = Math.max(2, Math.floor(ih / 11)), cw = iw / nx, ch = ih / ny;
      for (let gx = 0; gx < nx; gx++) for (let gy = 0; gy < ny; gy++) {
        if (R() < 0.12) { addTree(ix + (gx + 0.5) * cw, iy + (gy + 0.5) * ch, 2.2); continue; }
        const w = cw * (0.55 + R() * 0.15), h = ch * (0.55 + R() * 0.15);
        buildings.push({ x: ix + gx * cw + (cw - w) / 2, y: iy + gy * ch + (ch - h) / 2, w, h, ht: 5 + R() * 2.5, c: '#f3efe6', roof: pick(ROOF), house: R() < 0.5 ? 'x' : 'y' });
        if (R() < 0.5) addTree(ix + gx * cw + 1.6, iy + gy * ch + 1.6, 1.2 + R() * 0.6);
      }
    } else if (b.type === 'park') {
      const cx = ix + iw / 2, cy = iy + ih / 2;
      b.pond = { x: ix + iw * (R() < 0.5 ? 0.27 : 0.73), y: iy + ih * (R() < 0.5 ? 0.3 : 0.7), rx: Math.min(iw, ih) * 0.18, ry: Math.min(iw, ih) * 0.12 };
      for (let k = 0; k < (b.w > 50 ? 46 : 20); k++) {
        const x = ix + 2 + R() * (iw - 4), y = iy + 2 + R() * (ih - 4);
        if (Math.abs(x - cx) < 3 || Math.abs(y - cy) < 3) continue;
        if (((x - b.pond.x) / (b.pond.rx + 3)) ** 2 + ((y - b.pond.y) / (b.pond.ry + 3)) ** 2 < 1) continue;
        addTree(x, y);
      }
    } else if (b.type === 'parking') {
      for (let k = 0; k < 2; k++) for (let s = 0; s < 12; s++) if (R() < 0.6)
        parked.push({ x: ix + 2 + s * 2.8 + 1.4, y: iy + 6 + k * 20, h: k ? Math.PI : 0, c: pick(['#f4f4f4', '#9aa3ad', '#2b2d31', '#c0392b', '#2f6fdf', '#d9d2c5']) });
    } else if (b.type === 'mall') {
      buildings.push({ x: ix + 2, y: iy + 2, w: iw - 4, h: ih * 0.52, ht: 13, c: '#e9e4f0', flat: true, sign: 'SHOP' });
      for (let s = 0; s < Math.floor((iw - 4) / 2.8); s++) if (R() < 0.55) parked.push({ x: ix + 3.4 + s * 2.8, y: iy + ih * 0.78, h: R() < 0.5 ? 0 : Math.PI, c: pick(['#f4f4f4', '#9aa3ad', '#2b2d31', '#c0392b', '#2f6fdf']) });
    } else if (b.type === 'school') {
      buildings.push({ x: ix + 2, y: iy + 2, w: iw - 4, h: 11, ht: 14, c: '#f1ece2', flat: true, sign: '学校' });
      b.field = { x: ix + iw / 2, y: iy + 15 + (ih - 15) / 2, rx: iw / 2 - 3, ry: (ih - 15) / 2 - 3 };
      for (let k = 0; k < 8; k++) addTree(ix + 1.5, iy + 15 + k * (ih - 16) / 7, 1.5), addTree(ix + iw - 1.5, iy + 15 + k * (ih - 16) / 7, 1.5);
    }
  }

  // ================= sensors (same approach as the other level apps) =================
  let raw = null, source = 'demo', lastOrient = null, vote = -4, alive = false, running = false;
  const orientDown = (b, gm) => { const B = b * D2R, G = gm * D2R; return [Math.sin(G) * Math.cos(B), -Math.sin(B), -Math.cos(B) * Math.cos(G)]; };
  function onOrient(e) { if (e.beta == null || e.gamma == null) return; lastOrient = orientDown(e.beta, e.gamma); alive = true;
    if (source !== 'motion') { raw = lastOrient; source = 'orient'; } }
  function onMotion(e) {
    const a = e.accelerationIncludingGravity; if (!a || a.x == null || a.y == null || a.z == null) return;
    const n = Math.hypot(a.x, a.y, a.z); if (n < 2) return;
    const v = [a.x / n, a.y / n, a.z / n];
    if (lastOrient) { const d = v[1] * lastOrient[1] + v[2] * lastOrient[2]; if (Math.abs(d) > 0.3) vote = clamp(vote + (d > 0 ? 1 : -1), -40, 40); }
    const s = vote >= 0 ? 1 : -1; raw = [v[0] * s, v[1] * s, v[2] * s]; source = 'motion'; alive = true;
  }
  function screenAngle() { const a = (screen.orientation && typeof screen.orientation.angle === 'number') ? screen.orientation.angle
    : (typeof window.orientation === 'number' ? window.orientation : 0); return a * D2R; }
  // 0° = the screen's own "down" when the game starts (a true level reading); 0°合わせ replaces it with the current grip.
  // The reference lives in the device's frame, so steering keeps working even if the browser rotates the page mid-turn.
  let ref = null, flat = false, tiltRaw = 0;
  const screenDown = () => { const a = screenAngle(); return [-Math.sin(a), -Math.cos(a)]; };
  function readTilt() {
    if (source === 'demo') { flat = false; return simA; }
    if (!raw) return 0;
    const m = Math.hypot(raw[0], raw[1]);
    flat = m < 0.35; if (flat) return tiltRaw * 0.9;
    const cx = raw[0] / m, cy = raw[1] / m; if (!ref) ref = screenDown();
    return Math.atan2(ref[0] * cy - ref[1] * cx, ref[0] * cx + ref[1] * cy) / D2R;
  }
  function setZero() {
    if (source === 'demo') { simA = 0; return; }
    if (raw) { const m = Math.hypot(raw[0], raw[1]); if (m > 0.35) ref = [raw[0] / m, raw[1] / m]; }
  }
  window.addEventListener('orientationchange', () => { if (!running) ref = null; });

  // ================= input =================
  const keys = new Set(); let gasOn = false, brakeOn = false, simA = 0, drag = null;
  function pedal(el, set) {
    const ids = new Set();
    const upd = () => { set(ids.size > 0); el.classList.toggle('on', ids.size > 0); };
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); ids.add(e.pointerId); try { el.setPointerCapture(e.pointerId); } catch (_) {} upd(); });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => el.addEventListener(ev, e => { ids.delete(e.pointerId); upd(); }));
    el.addEventListener('contextmenu', e => e.preventDefault());
  }
  pedal($('gas'), v => gasOn = v); pedal($('brake'), v => brakeOn = v);
  $('zero').addEventListener('pointerdown', e => e.stopPropagation());
  $('zero').addEventListener('click', () => { setZero(); flash('ここを0°にしました'); });
  const stage = $('stage');
  stage.addEventListener('pointerdown', e => { if (source !== 'demo' || !running) return; drag = { x: e.clientX, a: simA, id: e.pointerId }; });
  stage.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.id) return; simA = clamp(drag.a + (e.clientX - drag.x) * 0.35, -90, 90); });
  ['pointerup', 'pointercancel'].forEach(ev => stage.addEventListener(ev, e => { if (drag && e.pointerId === drag.id) drag = null; }));
  window.addEventListener('keydown', e => {
    keys.add(e.key); if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    if (e.key === '0') setZero();
  });
  window.addEventListener('keyup', e => keys.delete(e.key));
  window.addEventListener('blur', () => keys.clear());

  // ================= vehicles =================
  const car = { x: nc(3) - 2.5, y: rx(5) + RW + 20, h: 0, v: 0, d: 0 };   // northbound, left lane
  const CAR_L = 4.4, WB = 2.6, VMAX = 17, VREV = -5;
  const npcs = [];
  const NPC_C = ['#f4f4f4', '#9aa3ad', '#2b2d31', '#c0392b', '#e8b730', '#3b8b5a', '#7a4fb0', '#f4f4f4'];
  const node = (i, j) => [nc(i), nc(j)];
  function laneEdge(a, b) { // straight lane points from intersection a to intersection b
    const [ax, ay] = node(...a), [bx, by] = node(...b), dx = Math.sign(bx - ax), dy = Math.sign(by - ay), lx = dy, ly = -dx, o = 2.5, s = RW / 2 + 1.5;
    return { d: [dx, dy], L: [lx, ly], p0: [ax + dx * s + lx * o, ay + dy * s + ly * o], p1: [bx - dx * s + lx * o, by - dy * s + ly * o] };
  }
  function extend(n) {
    const opts = neighbours(...n.to).filter(q => q[0] !== n.from[0] || q[1] !== n.from[1]);
    const next = opts.length ? pick(opts) : n.from;
    const e1 = laneEdge(n.from, n.to), e2 = laneEdge(n.to, next);
    const c = node(...n.to);

  function drawMini(t) {
    const k = 192 / SIZE; mctx.clearRect(0, 0, 192, 192); mctx.drawImage(mapImg, 0, 0);
    for (const n of npcs) { mctx.fillStyle = '#fff'; mctx.fillRect(n.x * k - 2, n.y * k - 2, 4, 4); }
    if (goal) { mctx.fillStyle = '#34c759'; mctx.beginPath(); mctx.arc(goal.x * k, goal.y * k, 6 + 2 * Math.sin(t * 5), 0, Math.PI * 2); mctx.fill(); }
    mctx.save(); mctx.translate(car.x * k, car.y * k); mctx.rotate(car.h); mctx.fillStyle = '#ff3b30'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 2;
    mctx.beginPath(); mctx.moveTo(0, -9); mctx.lineTo(6, 6); mctx.lineTo(0, 3); mctx.lineTo(-6, 6); mctx.closePath(); mctx.fill(); mctx.stroke(); mctx.restore();
  }

  // ================= HUD =================
  const tiltEl = $('tilt'), tiltV = $('tiltV'), gaugeI = document.querySelector('#gauge i'), kmh = $('kmh'), gear = $('gear'), mis = $('mis'), notice = $('notice');
  let flashMsg = '', flashUntil = 0;
  function flash(m) { flashMsg = m; flashUntil = performance.now() + 1600; }
  const fmtDeg = v => { let s = (Math.round(v * 10) / 10).toFixed(1); if (s === '-0.0') s = '0.0'; return s + '°'; };
  const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  let shownTilt = '', shownKmh = '', shownMis = '', shownNote = '';
  function hud(now, tilt) {
    const tv = fmtDeg(tilt); if (tv !== shownTilt) { shownTilt = tv; tiltV.textContent = tv; tiltEl.classList.toggle('zero', tv === '0.0°' || tv === '-0.0°'); }
    const g = clamp(tilt / 60, -1, 1); gaugeI.style.left = (g < 0 ? 50 + g * 50 : 50) + '%'; gaugeI.style.width = Math.abs(g) * 50 + '%';
    gaugeI.style.background = Math.abs(tilt) < 0.5 ? 'var(--ok)' : Math.abs(tilt) > 55 ? 'var(--red)' : 'var(--warn)';
    const kv = String(Math.round(Math.abs(car.v) * 3.6)); if (kv !== shownKmh) { shownKmh = kv; kmh.textContent = kv; }
    const r = car.v < -0.1; gear.textContent = r ? 'R' : 'D'; gear.classList.toggle('r', r);
    const mv = freeDrive ? '自由走行' : `配達 ${delivered}/${GOAL_N} · ${fmtTime(elapsed)}${goal ? ' · ' + Math.round(Math.hypot(goal.x - car.x, goal.y - car.y)) + 'm' : ''}`;
    if (mv !== shownMis) { shownMis = mv; mis.textContent = mv; }
    let note = '', warn = false;
    if (now < flashUntil) note = flashMsg;
    else if (running && source === 'demo') note = 'センサーなし：画面を左右にドラッグ(または←→キー)でハンドル、↑↓キーでアクセル・ブレーキ';
    else if (running && flat) { note = 'スマホを立てて、ハンドルのように持ってください'; warn = true; }
    if (note !== shownNote) { shownNote = note; notice.hidden = !note; notice.textContent = note; notice.classList.toggle('warn', warn); }
  }

  // ================= main loop =================
  let last = performance.now(), T = 0;
  function frame(now) {
    const dt = clamp((now - last) / 1000, 0, 0.033); last = now; T += dt;
    if (source === 'demo') { if (keys.has('ArrowLeft')) simA = Math.max(-90, simA - 90 * dt); if (keys.has('ArrowRight')) simA = Math.min(90, simA + 90 * dt);
      if (!keys.has('ArrowLeft') && !keys.has('ArrowRight') && !drag) simA *= Math.pow(0.04, dt); }
    tiltRaw = readTilt();
    const gas = running && (gasOn || keys.has('ArrowUp') || keys.has('w')), brk = running && (brakeOn || keys.has('ArrowDown') || keys.has(' ') || keys.has('s'));

    // car physics: a simple bicycle model; the phone's tilt is the steering wheel (±55° = full lock)
    let wheel = Math.abs(tiltRaw) < 1 ? 0 : clamp((tiltRaw - Math.sign(tiltRaw)) / 54, -1, 1);
    const dmax = 0.6 / (1 + Math.abs(car.v) * 0.11);
    car.d += (wheel * dmax - car.d) * Math.min(1, dt * 12);
    if (gas) car.v += (car.v < 0 ? 10 : 4.2 * (1 - car.v / VMAX)) * dt;
    if (brk) { if (car.v > 0.2) car.v = Math.max(0, car.v - 10 * dt); else { car.rev = (car.rev || 0) + dt; if (car.rev > 0.35) car.v = Math.max(VREV, car.v - 3 * dt); } }
    else car.rev = 0;
    if (!gas && !brk) car.v -= Math.sign(car.v) * Math.min(Math.abs(car.v), (0.5 + Math.abs(car.v) * 0.06) * dt);
    car.h += car.v / WB * Math.tan(car.d) * dt;
    car.x += Math.sin(car.h) * car.v * dt; car.y -= Math.cos(car.h) * car.v * dt;
    for (const n of npcs) stepNpc(n, dt);
    collide(now);

    if (running && !finished && !freeDrive) {
      elapsed += dt;
      if (goal && Math.hypot(goal.x - car.x, goal.y - car.y) < 6) {
        delivered++; flash(delivered < GOAL_N ? `お届けしました! (${delivered}/${GOAL_N})` : '');
        if (delivered >= GOAL_N) { finished = true; goal = null; showResult(); } else newGoal();
      }
    }

    // camera follows the car's heading a little behind, and pulls back with speed
    let dh = car.h - cam.h; dh = Math.atan2(Math.sin(dh), Math.cos(dh)); cam.h += dh * Math.min(1, dt * 5);
    const zt = Math.min(W, H) / (W > H ? 44 : 34) * (1 - 0.32 * Math.min(1, Math.abs(car.v) / VMAX)); cam.z += (zt - cam.z) * Math.min(1, dt * 2.5);
    shake = Math.max(0, shake - dt * 2.5);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#9ccf7a'; ctx.fillRect(0, 0, W, H);
    const sx = reduce ? 0 : (Math.random() - 0.5) * shake * 10, sy = reduce ? 0 : (Math.random() - 0.5) * shake * 10;
    ctx.translate(W / 2 + sx, H * AY() + sy); ctx.rotate(-cam.h); ctx.scale(cam.z, cam.z); ctx.translate(-car.x, -car.y);
    const Rv = Math.hypot(W, H) / cam.z + 10;
    const lead = H * (AY() - 0.5) / cam.z, C = [car.x + Math.sin(cam.h) * lead, car.y - Math.cos(cam.h) * lead];
    drawGround(C, Rv); drawShadows(C, Rv); drawGoal(T);
    for (const p of parked) if (Math.abs(p.x - C[0]) < Rv && Math.abs(p.y - C[1]) < Rv) drawCar(p.x, p.y, p.h, p.c);
    for (const n of npcs) if (Math.abs(n.x - C[0]) < Rv && Math.abs(n.y - C[1]) < Rv) drawCar(n.x, n.y, n.h, n.c, { brake: n.v < 3 });
    drawCar(car.x, car.y, car.h, '#2d6cdf', { steer: car.d, brake: brk && car.v > 0.2, reverse: car.v < -0.1 });
    for (const t of trees) if (Math.abs(t.x - C[0]) < Rv && Math.abs(t.y - C[1]) < Rv) drawTree(t, C);
    const vis = buildings.filter(b => Math.abs(b.x + b.w / 2 - C[0]) < Rv + 20 && Math.abs(b.y + b.h / 2 - C[1]) < Rv + 20);
    vis.sort((a, b) => Math.hypot(b.x + b.w / 2 - C[0], b.y + b.h / 2 - C[1]) - Math.hypot(a.x + a.w / 2 - C[0], a.y + a.h / 2 - C[1]));
    for (const b of vis) drawBuilding(b, C);

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // arrow to the destination when it is off screen
    if (goal) {
      const [gx, gy] = w2s(goal.x, goal.y), m = 40;
      if (gx < m || gx > W - m || gy < 130 || gy > H - 120) {
        const cx = W / 2, cy = H * 0.5, a = Math.atan2(gy - cy, gx - cx);
        const ex = clamp(cx + Math.cos(a) * 1e4, m, W - m), ey = clamp(cy + Math.sin(a) * 1e4, 140, H - 140);
        const t = Math.min((ex - cx) / Math.cos(a) || 1e9, (ey - cy) / Math.sin(a) || 1e9, 1e9);
        const px = cx + Math.cos(a) * Math.abs(t), py = cy + Math.sin(a) * Math.abs(t);
        const ax = clamp(isFinite(px) ? px : ex, m, W - m), ay = clamp(isFinite(py) ? py : ey, 140, H - 140);
        ctx.save(); ctx.translate(ax, ay); ctx.rotate(a);
        ctx.fillStyle = '#34c759'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-10, -12); ctx.lineTo(-4, 0); ctx.lineTo(-10, 12); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      }
    }
    drawWheel(tiltRaw);
    drawMini(T);
    hud(now, tiltRaw);
    requestAnimationFrame(frame);
  }

  function showResult() {
    $('rTime').textContent = fmtTime(elapsed);
    const stars = bumps === 0 ? 3 : bumps <= 3 ? 2 : 1;
    $('rStars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    $('rNote').textContent = bumps === 0 ? 'ぶつからずに完走! 安全運転です。' : `ぶつかった回数: ${bumps}回`;
    $('result').hidden = false;
  }

  // ================= start =================
  async function start() {
    if (start.busy) return; start.busy = true; $('gate').hidden = true;
    const asks = [];
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function')
      asks.push(DeviceMotionEvent.requestPermission().catch(() => 'denied'));
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function')
      asks.push(DeviceOrientationEvent.requestPermission().catch(() => 'denied'));
    window.addEventListener('deviceorientation', onOrient);
    window.addEventListener('devicemotion', onMotion);
    try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {}
    ref = null; running = true; resetGame();
    const res = await Promise.all(asks);
    const ok = res.some(r => r === 'granted') || asks.length === 0;
    setTimeout(() => { if (!alive) source = 'demo'; }, ok ? 1500 : 0);
  }
  $('gate').addEventListener('click', start);
  $('gate').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(); } });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) try { if (navigator.wakeLock && running) navigator.wakeLock.request('screen').catch(() => {}); } catch (_) {} });

  newGoal();
  requestAnimationFrame(frame);
  window.__drive = { car, npcs, get goal() { return goal; }, get bumps() { return bumps; }, setGoalHere: () => { goal = { x: car.x, y: car.y - 3 }; } };
})();
</script>
</body></html>
